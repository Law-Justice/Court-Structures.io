<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Court Systems: Climb the Courts</title>
<style>
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --surface2:#E4E8EF; --ink:#0B1F3A; --muted:#51627C; --line:#C9D1DE;
  --brass:#9A6F12; --brassbg:#F3E3B5; --red:#B3261E; --green:#1F7A52; --blue:#2A5BA6; --stamp:#B3261E;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0A1628;--surface:#12233D;--surface2:#1A2F50;--ink:#EAF0F8;--muted:#9FB0C7;--line:#2A4268;--brass:#E0B04F;--brassbg:#3A2F12;--red:#F0706A;--green:#5CC59A;--blue:#7FB0F0;--stamp:#F0706A;}
}
:root[data-theme="dark"]{--bg:#0A1628;--surface:#12233D;--surface2:#1A2F50;--ink:#EAF0F8;--muted:#9FB0C7;--line:#2A4268;--brass:#E0B04F;--brassbg:#3A2F12;--red:#F0706A;--green:#5CC59A;--blue:#7FB0F0;--stamp:#F0706A;}
html{font-size:clamp(14px,0.9vw + 8px,22px);scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.01em}
.mono{font-family:"Courier New",Courier,monospace}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
#app{display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;gap:.7rem;padding:.55rem 1rem;flex-wrap:wrap;border-bottom:2px solid var(--ink);background:var(--surface)}
.tag{background:var(--ink);color:var(--surface);font-family:"Courier New",monospace;font-weight:700;font-size:.78rem;border-radius:4px;padding:.15rem .6rem;letter-spacing:.08em}
.lvname{font-family:"Courier New",monospace;font-size:.78rem;letter-spacing:.14em;font-weight:700;color:var(--muted)}
.sp{flex:1}
.prog{width:min(12rem,28vw);height:.55rem;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--brass);transition:width .3s}
.stat{font-weight:700;font-size:.85rem}
main{flex:1;padding:1rem 1rem 1.5rem;width:100%}
.slide{max-width:1240px;margin:0 auto}
.stitle{font-size:clamp(1.6rem,3.4vw,2.5rem);margin:.1rem 0 .9rem;color:var(--ink)}
.docket{display:inline-block;font-family:"Courier New",monospace;font-weight:700;font-size:.75rem;letter-spacing:.16em;color:var(--brass);border:1.5px solid var(--brass);border-radius:4px;padding:.12rem .55rem;margin-bottom:.4rem}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.95rem 1.15rem;box-shadow:0 1px 0 var(--line),0 6px 14px -10px rgba(11,31,58,.35)}
.paper.brass{border-color:var(--brass);background:var(--surface)}
.lbl{font-family:"Courier New",monospace;font-size:.72rem;font-weight:700;letter-spacing:.16em;color:var(--brass);margin-bottom:.3rem}
.lbl.red{color:var(--red)} .lbl.green{color:var(--green)} .lbl.blue{color:var(--blue)}
.muted{color:var(--muted)} .big{font-size:1.25rem} .small{font-size:.85rem}
p{margin:.35rem 0}
ul{margin:.3rem 0;padding-left:1.2rem} li{margin:.25rem 0}
.grid{display:grid;gap:.8rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(13rem,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(11rem,1fr))}
.split{display:grid;grid-template-columns:minmax(8rem,17rem) 1fr;gap:1.3rem;align-items:start}
.split.wide{grid-template-columns:minmax(12rem,26rem) 1fr}
@media(max-width:700px){.split,.split.wide{grid-template-columns:1fr}}
.stack{display:grid;gap:.8rem}
.pic{margin:0}.pic img{width:100%;border-radius:8px;display:block;border:1px solid var(--line)}
.pic figcaption{color:var(--muted);font-size:.78rem;margin-top:.3rem;text-align:center}
.pic.white img{background:#fff;padding:.3rem}
.medal{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--brass);color:#fff;font-weight:800;font-family:Georgia,serif;flex:none}
.row{display:flex;gap:.7rem;align-items:flex-start}
.pill{display:inline-block;border-radius:4px;padding:.1rem .55rem;font-family:"Courier New",monospace;font-weight:700;font-size:.74rem;letter-spacing:.1em;color:#fff}
.p-green{background:var(--green)} .p-red{background:var(--red)} .p-blue{background:var(--blue)} .p-brass{background:var(--brass)}
.scroll{background:var(--brassbg);border:1px solid var(--brass);border-radius:6px;padding:1rem 1.2rem;font-family:Georgia,serif;font-style:italic}
.tabs{display:flex;gap:.4rem;margin-bottom:.5rem;flex-wrap:wrap}
.tab{border:1.5px solid var(--ink);background:var(--surface);border-radius:6px 6px 0 0;padding:.3rem .9rem;font-weight:700;font-size:.85rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.pane img{max-width:100%;border-radius:8px;background:#fff;border:1px solid var(--line)}
/* hero & act */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:2rem;align-items:center;min-height:62vh}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.3rem,6vw,4.1rem);line-height:1.02;margin:.3rem 0}
.art{width:100%;max-width:30rem;margin:0 auto;display:block}
.act{text-align:center;padding-top:1rem}
.act .no{font-family:"Courier New",monospace;letter-spacing:.35em;color:var(--brass);font-weight:700}
.act h1{font-size:clamp(2.1rem,5.5vw,3.6rem);margin:.3rem 0 .5rem}
.act .art{max-width:34rem;margin:1rem auto 0}
/* svg classes */
.s-ink{fill:var(--ink)} .s-surf{fill:var(--surface);stroke:var(--ink);stroke-width:2.5} .s-surf2{fill:var(--surface2);stroke:var(--ink);stroke-width:2}
.s-brass{fill:var(--brass)} .s-line{stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.s-brassline{stroke:var(--brass);stroke-width:3;fill:none;stroke-linecap:round}
.s-txt{fill:var(--ink);font:700 11px "Courier New",monospace;letter-spacing:.08em}
.s-mut{fill:var(--muted);font:700 10px "Courier New",monospace;letter-spacing:.08em}
/* quiz */
.q{font-size:clamp(1.4rem,3vw,2.2rem);margin:.3rem 0 1rem;line-height:1.2}
.opts{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr))}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opt{position:relative;overflow:hidden;text-align:left;background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:.8rem 1rem;min-height:3.4rem;display:flex;align-items:center;gap:.8rem;font-weight:700;font-size:1.05rem;box-shadow:3px 3px 0 var(--ink)}
.opt:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--brassbg);transition:width .4s}
.opt>*{position:relative}
.opt .lt{flex:none;background:var(--ink);color:var(--surface);border-radius:50%;width:1.9rem;height:1.9rem;display:grid;place-items:center;font-family:Georgia,serif}
.opt .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.opt.sel{outline:4px solid var(--brass);outline-offset:2px}
.opt.ok{background:var(--green);color:#fff;border-color:var(--green);box-shadow:3px 3px 0 var(--green)} .opt.ok .lt{background:#fff;color:var(--green)} .opt.ok .n{color:#fff}
.opt.no{opacity:.5;box-shadow:none}
.opt:disabled{cursor:default}
.why{margin-top:1rem;border-radius:10px;background:var(--brassbg);border:1px solid var(--brass);padding:.8rem 1.1rem}
.status{margin-top:.9rem;font-weight:700;min-height:1.5rem}
.good{color:var(--green)} .bad{color:var(--red)}
.petition{position:relative;background:var(--surface);border:1px solid var(--line);border-top:10px solid var(--brass);border-radius:6px 6px 10px 10px;padding:1rem 1.2rem 1.2rem;margin:.4rem 0 1rem;box-shadow:0 8px 16px -12px rgba(11,31,58,.5)}
.petition .pt{font-family:"Courier New",monospace;font-weight:700;letter-spacing:.14em;font-size:.78rem;color:var(--muted)}
.petition .pq{font-size:clamp(1.1rem,2.2vw,1.6rem);font-family:Georgia,serif;margin:.5rem 0}
.stampbox{display:flex;justify-content:flex-end;min-height:3.6rem;margin-top:.3rem}
.stamp{display:inline-block;border:4px solid var(--stamp);color:var(--stamp);font:800 1.7rem/1 "Courier New",monospace;letter-spacing:.14em;padding:.3rem .8rem;border-radius:6px;transform:rotate(-8deg);opacity:.92;animation:stampin .35s ease-out}
.stamp.green{border-color:var(--green);color:var(--green)}
@keyframes stampin{0%{transform:scale(2.4) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:.92}}
@media (prefers-reduced-motion: reduce){.stamp{animation:none}.prog>i,.opt .bar{transition:none}}
.tally{margin-top:.7rem;font-weight:700}
/* order */
.ordgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
@media(max-width:760px){.ordgrid{grid-template-columns:1fr}}
.pool{display:grid;gap:.5rem}
.ochip{text-align:left;background:var(--surface);border:2px solid var(--ink);border-radius:8px;padding:.55rem .8rem;font-weight:700;box-shadow:2px 2px 0 var(--ink)}
.ochip:disabled{opacity:.35;box-shadow:none;cursor:default}
.seq{list-style:none;margin:0;padding:0;display:grid;gap:.4rem;counter-reset:s}
.seq li{display:flex;gap:.6rem;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:.5rem .7rem;min-height:2.6rem;margin:0}
.seq li .nn{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.seq li.filled{border-style:solid;border-color:var(--ink)} .seq li.filled .nn{background:var(--ink);color:var(--surface)}
.seq li.right{border-color:var(--green)} .seq li.right .nn{background:var(--green);color:#fff}
.seq li.wrong{border-color:var(--red)} .seq li.wrong .nn{background:var(--red);color:#fff}
/* open */
.ta{width:100%;min-height:4.5rem;border-radius:8px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font:inherit;padding:.6rem .8rem}
.btn{background:var(--ink);color:var(--surface);border:0;border-radius:8px;padding:.55rem 1.3rem;font-weight:800;letter-spacing:.04em}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--ink)}
.btn.brass{background:var(--brass);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.7rem;margin-top:1rem}
.wall .note2{background:var(--brassbg);border:1px solid var(--brass);border-radius:4px;padding:.7rem .8rem;font-family:Georgia,serif;font-style:italic;transform:rotate(var(--r,0deg))}
/* stairs & board */
.stairs{width:100%;max-width:46rem;display:block;margin:0 auto}
.board{display:grid;gap:.45rem;max-width:42rem;margin:.8rem auto}
.board>div{display:flex;gap:.8rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.5rem .9rem}
.board .pos{width:1.8rem;font-weight:800;color:var(--brass);font-family:Georgia,serif}
.board .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.board .rk{color:var(--muted);font-size:.8rem}
.ranks{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.6rem;margin-top:.8rem}
.ranks .paper{text-align:center;padding:.6rem}
.center{text-align:center}
/* control bar & overlays */
.ctl{position:sticky;bottom:0;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;background:var(--surface);border-top:2px solid var(--ink);padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom,0px))}
.ctl label{font-size:.85rem;display:flex;gap:.3rem;align-items:center}
.note{background:var(--brassbg);border:1px solid var(--brass);border-radius:8px;padding:.5rem .9rem;margin:.5rem 1rem 0;font-size:.85rem}
.overlay{position:fixed;inset:0;background:rgba(8,16,32,.78);display:grid;place-items:center;z-index:20;padding:1rem}
.overlay[hidden]{display:none}
.modal{background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:1.4rem;width:min(26rem,100%);max-height:90vh;overflow:auto}
.modal.wide{width:min(46rem,100%)}
.inp{width:100%;border-radius:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font:inherit;padding:.6rem .8rem;margin:.7rem 0}
[hidden]{display:none!important}
@media(max-width:560px){
  .top{gap:.4rem;padding:.45rem .7rem}
  .lvname{display:none}
  .stat{font-size:.78rem}
  .prog{width:28vw}
  .opts.two{grid-template-columns:1fr}
  .ochip{padding:.4rem .65rem;font-size:.9rem}
  .pool{gap:.35rem}
  .seq{gap:.3rem}
  .seq li{min-height:2.1rem;padding:.3rem .55rem}
  .ctl{gap:.4rem;padding:.45rem .7rem calc(.45rem + env(safe-area-inset-bottom,0px))}
  .ctl .btn{padding:.4rem .8rem;font-size:.85rem}
  main{padding:.7rem .8rem 1.2rem}
  .q{margin-bottom:.7rem}
}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <span class="tag" id="tag">INTAKE</span><span class="lvname" id="lvname">CASE INTAKE</span>
    <span class="sp"></span>
    <span class="stat" id="stat"></span>
    <div class="prog" title="Case progress"><i id="prog"></i></div>
  </div>
  <div id="notes"></div>
  <main id="main"></main>
  <div class="ctl" id="ctl" hidden>
    <button class="btn alt" id="prev" aria-label="Previous slide">&larr; Prev</button>
    <span id="pos" class="small muted"></span>
    <button class="btn" id="next" aria-label="Next slide">Next &rarr;</button>
    <span class="sp"></span>
    <span id="qctl" hidden style="display:flex;gap:.6rem;align-items:center">
      <label><input type="checkbox" id="live"> Live tally</label>
      <button class="btn brass" id="reveal">Reveal answer</button>
    </span>
    <button class="btn alt" id="copylink">Copy student link</button>
    <button class="btn alt" id="boardbtn">The Docket</button>
    <button class="btn alt" id="reset" hidden>Reset class</button>
  </div>
</div>
<div class="overlay" id="land">
  <div class="modal">
    <h2>⚖️ Court Systems: Climb the Courts</h2>
    <p class="muted">A live classroom game about how our courts are structured.</p>
    <div style="display:grid;gap:.6rem;margin-top:.8rem">
      <button class="btn" id="bTeacher">I’m the teacher: start a class</button>
      <button class="btn alt" id="resumebtn" hidden>Resume my class</button>
      <button class="btn alt" id="bStudent">I’m a student: join a class</button>
      <div id="stuform" hidden><input class="inp" id="codein" maxlength="6" placeholder="Class code" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em;text-align:center"><button class="btn" id="codego" style="width:100%">Join</button></div>
      <button class="btn alt" id="bSolo">Try it solo</button>
    </div>
  </div>
</div>
<div class="overlay" id="join" hidden>
  <div class="modal">
    <h2>Name your case</h2>
    <p class="muted">Pick a nickname. Please don’t use your full name.</p>
    <input class="inp" id="nick" maxlength="18" placeholder="Nickname" autocomplete="off">
    <button class="btn" id="joinbtn">Start climbing</button>
  </div>
</div>
<div class="overlay" id="boardov" hidden>
  <div class="modal wide">
    <h2>The Docket</h2>
    <div id="boardlist"></div>
    <button class="btn alt" id="boardclose" style="margin-top:.8rem">Close</button>
  </div>
</div>

function shuffleOrder(n){
  var a=[],i;for(i=0;i<n;i++)a.push(i);
  var seed=n*7919+13;
  for(i=n-1;i>0;i--){seed=(seed*1103515245+12345)%2147483648;var j=seed%(i+1);var t=a[i];a[i]=a[j];a[j]=t;}
  var same=a.every(function(v,k){return v===k;});
  if(same&&n>1){a.push(a.shift());}
  return a;
}
function prepare(slides){
  ACTS=[{tag:'INTAKE',name:'CASE INTAKE'}];var cur=0;

    if(s.t==='act'){cur=ACTS.length;ACTS.push({tag:String(s.no||'ACT').toUpperCase().slice(0,12),name:String(s.title||'').toUpperCase().slice(0,40)});}

    if(s.t==='order'&&!(Array.isArray(s.perm)&&s.perm.length===s.items.length))s.perm=shuffleOrder(s.items.length);

}

function svgStairs(tokens,showLabels){
  var s='<svg class="stairs" viewBox="0 0 640 350" role="img" aria-label="Staircase from the district court to the Supreme Court with each student\u2019s case on a step">';
  for(var i=0;i<10;i++){var top=320-(i+1)*20;s+='<rect class="'+(i%2?'s-surf2':'s-surf')+'" x="'+(20+i*46)+'" y="'+top+'" width="46" height="'+(320-top)+'"/>';}
  s+=courthouseG(486,-4,.46);
  if(showLabels!==false){
    s+='<text class="s-mut" x="22" y="340">DISTRICT COURT</text><text class="s-mut" x="170" y="340">COURT OF APPEALS</text><text class="s-mut" x="330" y="340">CERT GRANTED</text><text class="s-mut" x="500" y="340">SUPREME COURT</text>';
  }
  var per={};
  (tokens||[]).slice(0,60).forEach(function(t,j){
    var st=t.step;per[st]=(per[st]||0)+1;var k=per[st]-1;
    var col=k%3,row=Math.floor(k/3);
    var cx=20+st*46+9+col*14,cy=320-(st+1)*20-9-row*16;
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="'+HUES[j%HUES.length]+'" stroke="#fff" stroke-width="1.5"/>';
  });
  return s+'</svg>';
}

var SL=prepare([{"t": "title", "kicker": "CASE FILE · COURT SYSTEMS", "heading": "Court Systems", "sub": "The structure of our legal system", "assignment": "You are a case on the docket. Answer correctly to climb from the district court to the Supreme Court."}, {"t": "brief"}, {"t": "act", "no": "ACT I", "title": "Filing the Case", "sub": "Three branches, judicial power, and precedent.", "art": "branches"}, {"t": "html", "title": "3 Branches", "body": "<div class=\"split wide\"><figure class=\"pic white\">[[img:branches|Infographic of the three branches of U.S. government: legislative, executive and judicial]]<\/figure><div class=\"stack\"><div class=\"paper\"><div class=\"lbl\">SEPARATION OF POWERS<\/div><p class=\"big\">Separation of powers in the United States.<\/p><p>While this is an ideal, the branches of government cross at many times.<\/p><\/div><div class=\"paper brass\"><div class=\"lbl\">WHERE THE BRANCHES CROSS<\/div><div class=\"grid g3\"><div><b>Abortion<\/b><\/div><div><b>Immigration<\/b><\/div><div><b>Student Loans<\/b><\/div><\/div><\/div><\/div><\/div>"}, {"t": "html", "title": "Judicial Power", "body": "<div class=\"split\"><figure class=\"pic\">[[img:marshall|Portrait of Chief Justice John Marshall]]<figcaption>John Marshall<\/figcaption><\/figure><div class=\"stack\"><div class=\"paper\"><div class=\"lbl\">MARBURY V. MADISON, 1803<\/div><p class=\"big\">Established the concept of <b>judicial review<\/b>, which permeates our society.<\/p><\/div><div class=\"scroll\">In the infamous words of John Marshall, courts have the power to “Say what the law is”.<\/div><div class=\"paper\"><p>This granted the judiciary the power of striking down laws it deems unconstitutional.<\/p><p class=\"muted\">We will learn more about how this transpired in 1803.<\/p><\/div><\/div><\/div>"}, {"t": "html", "title": "Precedent", "body": "<div class=\"split wide\"><figure class=\"pic white\">[[img:hier|Diagram of how U.S. and state courts are arranged in levels]]<\/figure><div class=\"stack\"><div class=\"paper\"><div class=\"lbl\">STARE DECISIS<\/div><p class=\"big\">Latin for “to stand by things decided.”<\/p><p>English common law influenced our judiciary structure, primarily with the concept of precedent.<\/p><\/div><div class=\"paper\"><p>Previous court decisions are used for the logic of current ones, and in general what has been decided before is the law going forward.<\/p><p class=\"muted\">This isn’t an absolute rule, as we will explore in class.<\/p><\/div><\/div><\/div>"}, {"t": "html", "title": "Precedent in Action", "body": "<div class=\"grid g2\"><div class=\"paper\"><div class=\"lbl\">PLESSY V. FERGUSON · 1896<\/div><p>The Court upheld “separate but equal.” That ruling became precedent that lower courts followed for decades.<\/p><\/div><div class=\"paper\"><div class=\"lbl green\">BROWN V. BOARD OF EDUCATION · 1954<\/div><p>The Court ruled that segregated public schools are unconstitutional, overruling <i>Plessy<\/i> for public education.<\/p><\/div><\/div><div class=\"paper brass\" style=\"margin-top:.8rem\"><div class=\"lbl\">WHY IT MATTERS<\/div><p class=\"big\">Precedent guides courts, but it isn’t absolute. The Supreme Court can overrule its own earlier rulings.<\/p><\/div>"}, {"t": "quiz", "id": "q1", "tag": "ACT I · EXHIBIT 1", "q": "Which Latin phrase means “to stand by things decided”?", "opts": ["Habeas corpus", "Stare decisis", "Writ of certiorari", "Amicus curiae"], "ans": 1, "why": "Stare decisis: previous decisions guide current ones.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "q2", "tag": "ACT I · EXHIBIT 2", "q": "Judicial review was established in which 1803 case?", "opts": ["Bush v. Gore", "Trump v. Anderson", "Marbury v. Madison", "Texas’s 2020 election lawsuit"], "ans": 2, "why": "Marbury v. Madison (1803) established judicial review.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "q3", "tag": "ACT I · EXHIBIT 3", "q": "English common law mainly influenced our courts’ use of which concept?", "opts": ["Precedent", "Executive orders", "Amendments", "Appointments"], "ans": 0, "why": "Precedent, also known as stare decisis.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "q4", "tag": "ACT I · EXHIBIT 4", "q": "Which 1954 case overruled the “separate but equal” precedent in public schools?", "opts": ["Marbury v. Madison", "Brown v. Board of Education", "Bush v. Gore", "Plessy v. Ferguson"], "ans": 1, "why": "Brown v. Board of Education overruled Plessy v. Ferguson for public education.", "pts": 50, "kind": "quiz"}, {"t": "act", "no": "ACT II", "title": "Which Court?", "sub": "Federal or state? Who sits on the Supreme Court?", "art": "fork"}, {"t": "html", "title": "What cases go where?", "body": "<div class=\"grid g2\"><div class=\"paper\"><div class=\"lbl blue\">FEDERAL COURTS<\/div><p><b>Original Jurisdiction<\/b> in cases involving:<\/p><ul><li>A Federal Law is being challenged<\/li><li>Treaties<\/li><li>U.S. Constitution<\/li><li>U.S. Government is party to litigation<\/li><\/ul><\/div><div class=\"paper\"><div class=\"lbl green\">STATE COURTS<\/div><p><b>Hear cases involving:<\/b><\/p><ul><li>Civil Cases<\/li><li>Criminal Cases<\/li><li>Other Cases/State Constitutional Cases<\/li><\/ul><\/div><\/div><div style=\"margin-top:1rem\"><div class=\"tabs\" role=\"tablist\"><button class=\"tab\" role=\"tab\" aria-selected=\"true\" data-pane=\"p1\">Federal court system<\/button><button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-pane=\"p2\">Colorado court system<\/button><\/div><div class=\"pane\" id=\"p1\">[[img:fed|Chart of the U.S. federal court system]]<\/div><div class=\"pane\" id=\"p2\" hidden>[[img:colo|Chart of the Colorado judicial system]]<\/div><\/div>"}, {"t": "quiz", "id": "j1", "tag": "ACT II · SORT THE CASE 1", "q": "Which court hears it first? A person is charged with robbery under state law.", "opts": ["Federal court", "State court"], "ans": 1, "why": "Criminal cases are heard by state courts here.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "j2", "tag": "ACT II · SORT THE CASE 2", "q": "Which court hears it first? A company argues that a federal law violates the U.S. Constitution.", "opts": ["Federal court", "State court"], "ans": 0, "why": "A challenge to a federal law or the U.S. Constitution goes to federal court.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "j3", "tag": "ACT II · SORT THE CASE 3", "q": "Which court hears it first? A civil lawsuit between a landlord and a tenant over a lease.", "opts": ["Federal court", "State court"], "ans": 1, "why": "Civil cases are heard by state courts here.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "j4", "tag": "ACT II · SORT THE CASE 4", "q": "Which court hears it first? The U.S. government sues a company for violating a federal regulation.", "opts": ["Federal court", "State court"], "ans": 0, "why": "When the U.S. government is a party to the litigation, it is a federal case.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "j5", "tag": "ACT II · SORT THE CASE 5", "q": "Which court hears it first? One driver sues another after a car accident (a civil case under state law).", "opts": ["Federal court", "State court"], "ans": 1, "why": "Civil cases like this are heard by state courts.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "j6", "tag": "ACT II · SORT THE CASE 6", "q": "Which court hears it first? A dispute over what a treaty between the U.S. and another country requires.", "opts": ["Federal court", "State court"], "ans": 0, "why": "Treaties are among the matters federal courts hear.", "pts": 50, "kind": "quiz"}, {"t": "html", "title": "The Supreme Court", "body": "<div class=\"split wide\"><figure class=\"pic\">[[img:scbldg|The U.S. Supreme Court building at dusk]]<\/figure><div class=\"stack\"><div class=\"paper\"><div class=\"lbl\">THE FINAL STOP<\/div><p>The Supreme Court is the final stop in the court system. They have the power to overrule all other courts (including their own previous rulings). This is called <b>Appellate Jurisdiction<\/b>.<\/p><\/div><div class=\"paper\"><div class=\"lbl\">THE NINE<\/div><p>There are currently <b>9 justices<\/b>. This number has fluctuated over time. Each member is appointed by the president and confirmed by the Senate by a majority vote. They serve for <b>life<\/b>.<\/p><\/div><\/div><\/div>"}, {"t": "html", "title": "The Supreme Court Justices", "body": "<div class=\"split wide\"><figure class=\"pic\">[[img:court|The nine justices of the Supreme Court seated and standing in black robes]]<figcaption>The Court as composed since June 30, 2022<\/figcaption><\/figure><div class=\"stack\"><div class=\"paper\"><div class=\"lbl\">FRONT ROW (L TO R)<\/div><ul><li>Sonia Sotomayor: Obama<\/li><li>Clarence Thomas: H.W. Bush<\/li><li><b>John G. Roberts, Jr. (Chief Justice): W. Bush<\/b><\/li><li>Samuel Alito: W. Bush<\/li><li>Elena Kagan: Obama<\/li><\/ul><\/div><div class=\"paper\"><div class=\"lbl\">BACK ROW (L TO R)<\/div><ul><li>Amy Coney Barrett: Trump<\/li><li>Neil Gorsuch: Trump<\/li><li>Brett Kavanaugh: Trump<\/li><li>Ketanji Brown Jackson: Biden<\/li><\/ul><\/div><\/div><\/div>"}, {"t": "quiz", "id": "k1", "tag": "ACT II · EXHIBIT 5", "q": "How are Supreme Court justices chosen, and how long do they serve?", "opts": ["Elected by voters for 8 years", "Appointed by the president, confirmed by the Senate, serve for life", "Chosen by Congress, serve 10 years", "Chosen by the other justices, serve for life"], "ans": 1, "why": "The president appoints, the Senate confirms by majority vote, and justices serve for life.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "k2", "tag": "ACT II · EXHIBIT 6", "q": "How many justices sit on the Supreme Court today?", "opts": ["Seven", "Eleven", "Nine", "Thirteen"], "ans": 2, "why": "Nine: the Chief Justice and eight associate justices.", "pts": 50, "kind": "quiz"}, {"t": "html", "title": "Original Jurisdiction", "body": "<div class=\"grid g2\"><div class=\"paper\"><div class=\"lbl\">THE SUPREME COURT HAS APPELLATE AND ORIGINAL JURISDICTION<\/div><p class=\"muted\">Granted by the Constitution, in these cases:<\/p><ul><li>Between U.S. and State<\/li><li>Between two or more states<\/li><li>Cases involving foreign ministers/ambassadors<\/li><li>A state vs. citizens of another state, or a foreign country<\/li><\/ul><\/div><div class=\"scroll\"><div class=\"lbl\" style=\"font-style:normal\">ARTICLE III, SECTION 2, CLAUSE 2<\/div>In all Cases affecting Ambassadors, other public Ministers and Consuls, and those in which a State shall be Party, the supreme Court shall have original Jurisdiction. In all the other Cases before mentioned, the supreme Court shall have appellate Jurisdiction, both as to Law and Fact, with such Exceptions, and under such Regulations as the Congress shall make.<\/div><\/div>"}, {"t": "quiz", "id": "k3", "tag": "ACT II · EXHIBIT 7", "q": "Two states sue each other. Which court hears the case first?", "opts": ["State trial court", "Federal district court", "Court of Appeals", "The Supreme Court"], "ans": 3, "why": "Cases between two or more states fall under the Supreme Court’s original jurisdiction.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "k4", "tag": "ACT II · EXHIBIT 8", "q": "Colorado and Utah disagree over rights to a shared river. Where does the case start?", "opts": ["The Supreme Court", "A Colorado district court", "A federal court of appeals", "A Utah state court"], "ans": 0, "why": "A dispute between two states falls under the Supreme Court’s original jurisdiction.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "k5", "tag": "ACT II · EXHIBIT 9", "q": "Which of these cases would NOT start in the Supreme Court?", "opts": ["Two states suing each other", "A case affecting an ambassador", "A person charged with robbery under state law", "The U.S. suing a state"], "ans": 2, "why": "An ordinary criminal case starts in a state trial court, not the Supreme Court.", "pts": 50, "kind": "quiz"}, {"t": "act", "no": "ACT III", "title": "The Road to the Supreme Court", "sub": "About 80 cases a year out of about 7,000 requests.", "art": "road"}, {"t": "html", "title": "How does a case reach the Supreme Court?", "body": "<div class=\"split wide\"><figure class=\"pic white\">[[img:flow|Flowchart showing how a case moves from lower courts up to the Supreme Court]]<\/figure><div class=\"stack\"><div class=\"paper\"><div class=\"lbl\">THE ODDS<\/div><p class=\"big\">The Supreme Court hears about <b>80 cases<\/b> a year, out of about <b>7,000<\/b> requested.<\/p><\/div><div class=\"paper\"><p>In all cases not involving Original Jurisdiction, a case has to work its way through all of the lower courts first. Each court beforehand makes a decision. The loser can ‘appeal’ this decision to a superior court. Eventually this reaches the Supreme Court.<\/p><\/div><div class=\"paper brass\"><div class=\"lbl\">WRIT OF CERTIORARI<\/div><p>When the Supreme Court accepts the petition to hear the case, it is called being granted a ‘Writ of Certiorari’. <b>4 justices must agree<\/b> to grant a Writ.<\/p><\/div><\/div><\/div>"}, {"t": "quiz", "id": "c1", "tag": "ACT III · EXHIBIT 10", "q": "How many justices must agree to grant a Writ of Certiorari?", "opts": ["3", "5", "4", "9"], "ans": 2, "why": "The Rule of Four: four justices must agree to grant a writ.", "pts": 50, "kind": "quiz"}, {"t": "html", "title": "Deciding to take a case", "body": "<p class=\"muted\">Supremes are more likely to take a case if:<\/p><div class=\"grid g3\"><div class=\"paper\"><div class=\"row\"><span class=\"medal\">1<\/span><div><b>Circuit Split<\/b><p class=\"small\">Lower courts came to different conclusions.<\/p><\/div><\/div><\/div><div class=\"paper\"><div class=\"row\"><span class=\"medal\">2<\/span><div><b>Important Issues<\/b><p class=\"small\">Major social issue like abortion, equality, gun control, death penalty, etc.<\/p><\/div><\/div><\/div><div class=\"paper\"><div class=\"row\"><span class=\"medal\">3<\/span><div><b>Lower court disregard<\/b><p class=\"small\">Lower court ruled against Supreme Court precedent.<\/p><\/div><\/div><\/div><div class=\"paper\"><div class=\"row\"><span class=\"medal\">4<\/span><div><b>Judicial Interest<\/b><p class=\"small\">Case is in a justice’s expertise.<\/p><\/div><\/div><\/div><div class=\"paper\"><div class=\"row\"><span class=\"medal\">5<\/span><div><b>National Impact<\/b><p class=\"small\">Nation is impacted by decision; courts may speed up their usually long process (Bush v. Gore, Trump v. Anderson).<\/p><\/div><\/div><\/div><div class=\"paper\"><div class=\"row\"><span class=\"medal\">6<\/span><div><b>Harmonizing Decisions<\/b><p class=\"small\">Federal Courts came to different conclusions on similar cases.<\/p><\/div><\/div><\/div><\/div>"}, {"t": "quiz", "id": "p1", "tag": "ACT III · CERT DESK 1", "q": "Two federal circuit courts have ruled in opposite ways on the same federal law.", "opts": ["GRANT the writ", "DENY the writ"], "ans": 0, "why": "Circuit split: lower courts reached different conclusions, so the Court is likely to step in.", "pts": 50, "kind": "vote", "stamp": ["GRANTED", "DENIED"]}, {"t": "quiz", "id": "p2", "tag": "ACT III · CERT DESK 2", "q": "A neighbor dispute over a fence. A state court ruled. No constitutional or federal issue, and no split.", "opts": ["GRANT the writ", "DENY the writ"], "ans": 1, "why": "None of the usual factors apply: no split, no major issue, no national impact.", "pts": 50, "kind": "vote", "stamp": ["GRANTED", "DENIED"]}, {"t": "quiz", "id": "p3", "tag": "ACT III · CERT DESK 3", "q": "A lower court ruled directly against an earlier Supreme Court precedent.", "opts": ["GRANT the writ", "DENY the writ"], "ans": 0, "why": "Lower court disregard of Supreme Court precedent makes a case more likely to be taken.", "pts": 50, "kind": "vote", "stamp": ["GRANTED", "DENIED"]}, {"t": "quiz", "id": "p4", "tag": "ACT III · CERT DESK 4", "q": "A ruling about who can appear on presidential ballots, with a national election close and the whole country affected.", "opts": ["GRANT the writ", "DENY the writ"], "ans": 0, "why": "National impact: the Court may even speed up its usual process (Bush v. Gore, Trump v. Anderson).", "pts": 50, "kind": "vote", "stamp": ["GRANTED", "DENIED"]}, {"t": "quiz", "id": "p5", "tag": "ACT III · CERT DESK 5", "q": "A state’s new gun law is challenged as unconstitutional. A state court and a federal appeals court have disagreed, and it is a major national issue.", "opts": ["GRANT the writ", "DENY the writ"], "ans": 0, "why": "A split between courts plus an important social issue makes review likely.", "pts": 50, "kind": "vote", "stamp": ["GRANTED", "DENIED"]}, {"t": "quiz", "id": "p6", "tag": "ACT III · CERT DESK 6", "q": "A dispute over a $200 parking ticket, decided by a state court. No federal or constitutional question.", "opts": ["GRANT the writ", "DENY the writ"], "ans": 1, "why": "No split, no important issue, and no national impact.", "pts": 50, "kind": "vote", "stamp": ["GRANTED", "DENIED"]}, {"t": "html", "title": "Supreme Court Timeline", "body": "<p class=\"muted\">Most cases get decided in June–July. This is why you see so much news/impact early in the summer.<\/p><div class=\"grid g2\"><div class=\"paper\"><div class=\"row\"><span class=\"medal\">1<\/span><div><b>Writ of Certiorari granted<\/b><\/div><\/div><\/div><div class=\"paper\"><div class=\"row\"><span class=\"medal\">2<\/span><div><b>Briefs<\/b><p class=\"small\">Petitioner explains legal argument, why the lower court got it wrong.<\/p><\/div><\/div><\/div><div class=\"paper\"><div class=\"row\"><span class=\"medal\">3<\/span><div><b>Amicus Briefs<\/b><p class=\"small\">Non-parties to the case may file if they have a stake in the outcome.<\/p><\/div><\/div><\/div><div class=\"paper\"><div class=\"row\"><span class=\"medal\">4<\/span><div><b>Oral Arguments<\/b><p class=\"small\">Each side has 30 minutes to present their case, one attorney on either side. Justices also ask clarifying questions.<\/p><\/div><\/div><\/div><div class=\"paper\"><div class=\"row\"><span class=\"medal\">5<\/span><div><b>Conference<\/b><p class=\"small\">Justices discuss all aspects of the case and their perspectives.<\/p><\/div><\/div><\/div><div class=\"paper\"><div class=\"row\"><span class=\"medal\">6<\/span><div><b>Voting<\/b><p class=\"small\">Justices vote on the case. Majority wins. A justice is selected to author the opinion.<\/p><\/div><\/div><\/div><div class=\"paper\"><div class=\"row\"><span class=\"medal\">7<\/span><div><b>Opinions<\/b><p class=\"small\">A Justice writes a majority opinion, ensuring all justices in the majority agree. Other opinions may be authored and signed onto, often a dissent at the very least. The opinion outlines why they decided the case, citing case law and constitutional law. This part is vital: a case decided on shaky sources may be picked apart later.<\/p><\/div><\/div><\/div><div class=\"paper\"><div class=\"row\"><span class=\"medal\">8<\/span><div><b>Publication<\/b><p class=\"small\">Case is published and available for the public.<\/p><\/div><\/div><\/div><\/div>"}, {"t": "order", "id": "o1", "tag": "ACT III · DOCKET ORDER", "q": "Put the stages of a Supreme Court case in order. Tap them one at a time.", "items": ["Writ of Certiorari granted", "Briefs filed", "Amicus briefs filed", "Oral arguments", "Conference", "Voting", "Opinions written", "Publication"], "perm": [4, 0, 6, 2, 7, 1, 5, 3], "pts": 100, "why": "Correct order: cert granted, briefs, amicus briefs, oral arguments, conference, voting, opinions, publication."}, {"t": "html", "title": "Standing", "body": "<div class=\"split wide\"><figure class=\"pic\">[[img:statue|Statue of Lady Justice holding scales]]<\/figure><div class=\"stack\"><div class=\"paper\"><div class=\"lbl\">THE RULE<\/div><p class=\"big\">Standing is the idea that the party bringing the case has been harmed. If a party is determined to not have standing, the case is dismissed.<\/p><\/div><div class=\"paper\"><div class=\"lbl\">A RECENT EXAMPLE<\/div><p>Texas sued other states, including Georgia, over the election results from 2020. The Supreme Court had Original Jurisdiction because it was one state suing another. The court dismissed the lawsuit due to lack of standing:<\/p><\/div><div class=\"scroll\">“Texas has not demonstrated a judicially cognizable interest in the manner in which another State conducts its elections.”<\/div><\/div><\/div>"}, {"t": "quiz", "id": "s1", "tag": "ACT III · STANDING CHECK 1", "q": "Maria sues her city over a new fee that she personally has to pay every month.", "opts": ["Has standing", "No standing"], "ans": 0, "why": "She has been personally harmed, so she has standing.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "s2", "tag": "ACT III · STANDING CHECK 2", "q": "A man sues over a federal law because he dislikes it, but it doesn’t affect him at all.", "opts": ["Has standing", "No standing"], "ans": 1, "why": "No personal harm means no standing, and the case is dismissed.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "s3", "tag": "ACT III · STANDING CHECK 3", "q": "A student sues because her school unfairly took away her scholarship.", "opts": ["Has standing", "No standing"], "ans": 0, "why": "She was directly harmed, so she has standing.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "s4", "tag": "ACT III · STANDING CHECK 4", "q": "A taxpayer sues only because he thinks the government should spend its money differently.", "opts": ["Has standing", "No standing"], "ans": 1, "why": "A general disagreement with government spending is usually not a personal harm, so courts generally find no standing.", "pts": 50, "kind": "quiz"}, {"t": "act", "no": "ACT IV", "title": "The Ruling", "sub": "Opinions, impact, and your turn on the bench.", "art": "ruling"}, {"t": "html", "title": "Supreme Court Decisions", "body": "<p>You will see a variety of opinions of the court. The most important is obviously the Majority. What’s contained in there is the precedent being set. The other opinions are important as well, and may be cited for arguments in other cases (although it’s not precedent).<\/p><div class=\"grid g3\"><div class=\"paper\"><span class=\"pill p-green\">MAJORITY<\/span><p>The opinion of the majority of justices.<\/p><\/div><div class=\"paper\"><span class=\"pill p-blue\">CONCURRENCE<\/span><p>Agree with the majority, but may have additional or different opinions.<\/p><\/div><div class=\"paper\"><span class=\"pill p-red\">DISSENT<\/span><p>The minority opinion, may be multiple. Explaining what is wrong with the majority.<\/p><\/div><\/div>"}, {"t": "quiz", "id": "m1", "tag": "ACT IV · EXHIBIT 11", "q": "Which opinion sets the precedent?", "opts": ["Dissent", "Concurrence", "Majority opinion", "Amicus brief"], "ans": 2, "why": "The majority opinion contains the precedent being set.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "m2", "tag": "ACT IV · EXHIBIT 12", "q": "A justice agrees with the outcome but for different reasons. What do they write?", "opts": ["A dissent", "A concurrence", "A majority opinion", "A brief"], "ans": 1, "why": "A concurrence agrees with the majority but may have additional or different reasoning.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "m3", "tag": "ACT IV · EXHIBIT 13", "q": "A justice disagrees with the majority and explains what is wrong with it. What is this opinion called?", "opts": ["A concurrence", "A majority opinion", "A dissent", "A brief"], "ans": 2, "why": "A dissent is the minority opinion explaining what is wrong with the majority.", "pts": 50, "kind": "quiz"}, {"t": "open", "id": "w1", "title": "Your Turn on the Bench", "pre": "<div class=\"paper\"><div class=\"lbl\">THE CASE<\/div><p class=\"big\">A school district bans all phones during class. A student sues, claiming the ban violates free speech. The Court rules 5–4 in favor of the school.<\/p><\/div>", "prompt": "You are in the minority. Write a one-sentence dissent explaining what is wrong with the majority."}, {"t": "html", "title": "Impactful Cases", "body": "<div class=\"paper\"><p>Because the Supreme Court has the ability to decide what the law is, they can effectively both create law and deconstruct law based on their interpretation of the law.<\/p><p><a href=\"https://www.smokeball.com/blog/8-of-the-most-controversial-famous-supreme-court-cases/\" target=\"_blank\" rel=\"noopener noreferrer\">Read about 8 of the most controversial Supreme Court cases<\/a><\/p><\/div><div class=\"grid g2\" style=\"margin-top:.8rem\"><div class=\"paper\"><div class=\"lbl\">MARBURY V. MADISON · 1803<\/div><p>Established judicial review.<\/p><\/div><div class=\"paper\"><div class=\"lbl\">BUSH V. GORE<\/div><p>A fast-tracked ruling because of national impact.<\/p><\/div><div class=\"paper\"><div class=\"lbl\">TRUMP V. ANDERSON<\/div><p>Arose from a Colorado Supreme Court ruling about the ballot; also moved quickly because of national impact.<\/p><\/div><div class=\"paper\"><div class=\"lbl\">TEXAS’S 2020 ELECTION LAWSUIT<\/div><p>Dismissed for lack of standing.<\/p><\/div><\/div>"}, {"t": "quiz", "id": "g1", "tag": "ACT IV · FINAL EXHIBIT 1", "q": "Which case arose from a Colorado Supreme Court ruling about the ballot?", "opts": ["Marbury v. Madison", "Bush v. Gore", "Texas’s 2020 election lawsuit", "Trump v. Anderson"], "ans": 3, "why": "Trump v. Anderson came from Colorado.", "pts": 50, "kind": "quiz"}, {"t": "quiz", "id": "g2", "tag": "ACT IV · FINAL EXHIBIT 2", "q": "Texas’s 2020 election lawsuit against other states was dismissed. Why?", "opts": ["Lack of standing", "It was filed too late", "The Court lacked jurisdiction over states", "The justices were deadlocked"], "ans": 0, "why": "The Court said Texas had not shown a judicially cognizable interest in how another state runs its elections.", "pts": 50, "kind": "quiz"}, {"t": "final"}]);
var N=SL.length;

/* ---------- state ---------- */
var role='lobby';
var state={idx:0,revealed:{},live:false};
var answers={};
var mine={name:'',picks:{},texts:{}};
var $=function(s){return document.querySelector(s);};
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function note(msg){var n=$('#notes');n.textContent='';if(msg)n.appendChild(el('div','note',msg));}
function rankOf(xp){var p=xp/MAXXP;return p>=.75?RUNG[3]:p>=.5?RUNG[2]:p>=.25?RUNG[1]:RUNG[0];}
function scoreSlide(s,doc){
  var p=doc&&doc.picks?doc.picks[s.id]:undefined;
  if(s.t==='quiz')return p===s.ans?s.pts:0;
  if(s.t==='order'){if(!Array.isArray(p)||p.length!==s.items.length)return 0;var c=0;p.forEach(function(v,i){if(v===i)c++;});return Math.round(s.pts*c/s.items.length);}
  return 0;
}
function xpOf(doc){var x=0;SL.forEach(function(s){if((s.t==='quiz'||s.t==='order')&&state.revealed[s.id])x+=scoreSlide(s,doc);});return x;}
function counts(s){var c=s.opts.map(function(){return 0;}),tot=0;Object.keys(answers).forEach(function(k){var p=answers[k]&&answers[k].picks?answers[k].picks[s.id]:undefined;if(typeof p==='number'&&p>=0&&p<c.length){c[p]++;tot++;}});return {c:c,tot:tot};}
function joined(){return Object.keys(answers).filter(function(k){return answers[k]&&answers[k].name;}).length;}
function isHost(){return role==='teacher'||role==='solo';}
function canAnswer(){return role==='student'||role==='solo';}

/* ---------- persistence & network ---------- */
var peer=null,conns={},hostCode='',sconn=null,retryT=null,ansTimer=null,myUid='';
var CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function newCode(){var s='';for(var i=0;i<4;i++)s+=CODE_CHARS.charAt(Math.floor(Math.random()*CODE_CHARS.length));return s;}
/* ---- Relay (TURN) settings: paste your free Metered.ca app name and API key here ---- */
var TURN_RELAY=/*RELAY*/{app:'',apiKey:''};
var relayOn=false;
var STUN=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}];
function getIce(){
  var done=function(list){return Promise.resolve(list);};
  var app=TURN_RELAY.app,key=TURN_RELAY.apiKey;
  if(!app||!key||typeof fetch!=='function')return done(STUN);
  var ctl=(typeof AbortController==='function')?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort();},5000);
  return fetch('https://'+encodeURIComponent(app)+'.metered.live/api/v1/turn/credentials?apiKey='+encodeURIComponent(key),ctl?{signal:ctl.signal}:{})
    .then(function(r){if(!r.ok)throw new Error('relay '+r.status);return r.json();})
    .then(function(list){clearTimeout(to);if(Array.isArray(list)&&list.length){relayOn=true;return STUN.concat(list);}return STUN;})
    .catch(function(){clearTimeout(to);return STUN;});
}
function peerOpts(ice){
  var o=peerOpts0();o.config={iceServers:ice||STUN};return o;
}
function peerOpts0(){
  var p=new URLSearchParams(location.search).get('ps');
  if(p){var a=p.split(':');return {host:a[0],port:Number(a[1]||9000),path:'/',secure:a[2]==='1',debug:0};}
  return {debug:0};
}
function clean(d,lockedFrom){
  var o={name:'',picks:{},texts:{}};
  if(!d||typeof d!=='object')return o;
  o.name=String(d.name||'').slice(0,18);
  if(d.picks&&typeof d.picks==='object')Object.keys(d.picks).slice(0,60).forEach(function(k){
    var v=d.picks[k];
    if(!/^[a-z0-9]{1,4}$/.test(k))return;
    if(typeof v==='number'&&v>=0&&v<8)o.picks[k]=v;
    else if(Array.isArray(v)&&v.length<=10&&v.every(function(n){return typeof n==='number'&&n>=0&&n<10&&n%1===0;}))o.picks[k]=v.slice();
  });
  if(d.texts&&typeof d.texts==='object')Object.keys(d.texts).slice(0,10).forEach(function(k){
    var a=d.texts[k];
    if(/^[a-z0-9]{1,12}$/.test(k)&&Array.isArray(a))o.texts[k]=a.slice(0,5).map(function(x){return String(x).slice(0,80);});
  });
  return o;
}
function connectedCount(){return Object.keys(conns).filter(function(k){return conns[k].open;}).length;}
function broadcast(m){Object.keys(conns).forEach(function(k){var c=conns[k];if(c.open){try{c.send(m);}catch(e){}}});}
function persistHost(){lsSet('courtclimb-host',{code:hostCode,state:state,answers:answers});}
function pushState(){
  if(role!=='teacher')return;
  broadcast({t:'state',state:state});persistHost();
}
function scheduleAnswers(){
  if(ansTimer)return;
  ansTimer=setTimeout(function(){ansTimer=null;broadcast({t:'answers',answers:answers});},250);
}
function saveMine(){
  answers[myUid]=mine;
  if(role==='student'){lsSet('courtclimb-doc-'+hostCode,mine);if(sconn&&sconn.open){try{sconn.send({t:'doc',doc:mine});}catch(e){}}}
  updateDynamic();
}

/* teacher side */
function mergeDoc(uid,doc){
  var nd=clean(doc),old=answers[uid]||{picks:{},texts:{}};
  Object.keys(state.revealed).forEach(function(k){ // answers lock when revealed
    if(old.picks&&k in old.picks)nd.picks[k]=old.picks[k];else delete nd.picks[k];
  });
  answers[uid]=nd;persistHost();scheduleAnswers();updateDynamic();
}
function onHostMsg(c,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='join'&&typeof m.uid==='string'){
    c.lqUid=m.uid.slice(0,40).replace(/[^A-Za-z0-9_-]/g,'');
    if(!c.lqUid)return;
    if(m.doc&&!answers[c.lqUid])mergeDoc(c.lqUid,m.doc);
    else if(m.doc&&answers[c.lqUid]&&!answers[c.lqUid].name&&m.doc.name)mergeDoc(c.lqUid,m.doc);
    try{c.send({t:'hello',state:state,answers:answers,doc:answers[c.lqUid]||null});}catch(e){}
    updateDynamic();
  } else if(m.t==='doc'&&c.lqUid){mergeDoc(c.lqUid,m.doc);}
}
function startHost(code,resume){
  hostCode=code||newCode();
  var tries=0,iceList=STUN;
  function make(){
    peer=new Peer('courtclimb-'+hostCode,peerOpts(iceList));
    peer.on('open',function(){
      role='teacher';note('');persistHost();
      $('#land').hidden=true;renderSlide();
    });
    peer.on('connection',function(c){
      conns[c.connectionId]=c;
      c.on('data',function(m){onHostMsg(c,m);});
      c.on('close',function(){delete conns[c.connectionId];updateDynamic();});
      c.on('error',function(){delete conns[c.connectionId];updateDynamic();});
      c.on('open',function(){updateDynamic();});
    });
    peer.on('error',function(e){
      if(e.type==='unavailable-id'){
        if(resume&&tries<6){tries++;note('Reclaiming your class code… ('+tries+')');try{peer.destroy();}catch(x){}setTimeout(make,3000);}
        else{hostCode=newCode();try{peer.destroy();}catch(x){}make();}
      } else {note('Network problem ('+e.type+'). Students may not be able to connect. Check your internet or try again.');}
    });
    peer.on('disconnected',function(){try{peer.reconnect();}catch(e){}});
  }
  getIce().then(function(l){iceList=l;make();});
}

/* student side */
function applyState(d){
  var idxChanged=d.idx!==state.idx;
  state={idx:typeof d.idx==='number'?Math.max(0,Math.min(N-1,d.idx)):0,revealed:d.revealed||{},live:!!d.live};
  return idxChanged;
}
function studentConnect(){
  clearTimeout(retryT);
  if(!peer||peer.destroyed)return;
  if(peer.disconnected){try{peer.reconnect();}catch(e){}}
  sconn=peer.connect('courtclimb-'+hostCode,{reliable:true});
  var opened=false;
  sconn.on('open',function(){opened=true;note('');sconn.send({t:'join',uid:myUid,doc:mine.name?mine:null});});
  sconn.on('data',function(m){
    if(!m||typeof m!=='object')return;
    if(m.t==='hello'){
      if(!mine.name&&m.doc&&m.doc.name)mine=clean(m.doc);
      applyState(m.state||{});answers=m.answers||{};if(mine.name)answers[myUid]=mine;
      renderSlide();showJoin();
    } else if(m.t==='state'){
      var ch=applyState(m.state||{});
      if(ch)renderSlide();else{updateControls();updateDynamic();}
    } else if(m.t==='answers'){
      answers=m.answers||{};if(mine.name)answers[myUid]=mine;updateDynamic();
    } else if(m.t==='reset'){
      mine=clean({name:mine.name});answers={};lsSet('courtclimb-doc-'+hostCode,mine);state={idx:0,revealed:{},live:false};renderSlide();
      if(mine.name&&sconn&&sconn.open)sconn.send({t:'doc',doc:mine});
    }
  });
  var lost=function(){note('Connection to your teacher was lost. Reconnecting…');clearTimeout(retryT);retryT=setTimeout(studentConnect,3000);};
  sconn.on('close',lost);sconn.on('error',lost);
  setTimeout(function(){if(!opened)note('Looking for class '+hostCode+'… Check the code and make sure your teacher has started the class.');},6000);
  setTimeout(function(){if(!opened)note(relayOn?'Still trying to reach your teacher through the network relay…':'Can’t open a connection to your teacher. This often happens when you and your teacher are on different networks (for example Wi-Fi and wired). Ask your teacher to turn on the relay setting.');},15000);
}
function startStudent(code){
  hostCode=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
  if(!hostCode)return;
  role='student';
  myUid=lsGet('courtclimb-uid');
  if(!myUid){myUid='s'+Math.random().toString(36).slice(2,12);lsSet('courtclimb-uid',myUid);}
  var saved=lsGet('courtclimb-doc-'+hostCode);if(saved)mine=clean(saved);
  if(!mine.name){var nk=lsGet('courtclimb-nick');if(nk)mine.name=String(nk).slice(0,18);}
  $('#land').hidden=true;note('Connecting to class '+hostCode+'…');
  renderSlide();showJoin();
  getIce().then(function(ice){
    peer=new Peer(peerOpts(ice));
    peer.on('open',studentConnect);
    peer.on('error',function(e){
      if(e.type==='peer-unavailable'){note('No class with code '+hostCode+' is running yet. Retrying…');clearTimeout(retryT);retryT=setTimeout(studentConnect,3000);}
      else note('Network problem ('+e.type+'). Your school network may be blocking this page.');
    });
  });
}

/* ---------- rendering ---------- */
function stairsToken(doc){
  var xp=xpOf(doc);return Math.max(0,Math.min(9,Math.floor(xp/MAXXP*10)));
}
function renderSlide(){
  var s=SL[state.idx]||SL[0];
  $('#main').innerHTML=slideHtml(s);
  $('#tag').textContent=ACTS[s.lv].tag;$('#lvname').textContent=ACTS[s.lv].name;
  $('#prog').style.width=Math.round(state.idx/(N-1)*100)+'%';
  $('#pos').textContent=(state.idx+1)+' / '+N;
  window.scrollTo(0,0);
  bindSlide(s);
  updateControls();
  updateDynamic();
}

function bindSlide(s){
  var tabs=document.querySelectorAll('.tab');
  tabs.forEach(function(t){t.addEventListener('click',function(){
    tabs.forEach(function(o){o.setAttribute('aria-selected',o===t?'true':'false');});
    document.querySelectorAll('.pane').forEach(function(p){p.hidden=(p.id!==t.getAttribute('data-pane'));});
  });});
  if(s.t==='quiz'){
    $('#opts').addEventListener('click',function(e){
      var b=e.target.closest('.opt');if(!b||!canAnswer()||state.revealed[s.id])return;
      mine.picks[s.id]=Number(b.getAttribute('data-i'));saveMine();
    });
  }
  if(s.t==='order'){
    $('#pool').addEventListener('click',function(e){
      var b=e.target.closest('.ochip');if(!b||!canAnswer()||state.revealed[s.id])return;
      var arr=Array.isArray(mine.picks[s.id])?mine.picks[s.id].slice():[];var i=Number(b.getAttribute('data-i'));
      if(arr.indexOf(i)>=0||arr.length>=s.items.length)return;
      arr.push(i);mine.picks[s.id]=arr;saveMine();
    });
    $('#oclear').addEventListener('click',function(){if(!canAnswer()||state.revealed[s.id])return;mine.picks[s.id]=[];saveMine();});
  }
  if(s.t==='open'){
    var send=function(){
      var ta=$('#ta');var v=ta.value.trim();if(!v||!canAnswer())return;
      var arr=mine.texts[s.id]||[];if(arr.length>=3)return;
      mine.texts[s.id]=arr.concat([v.slice(0,160)]);ta.value='';saveMine();
    };
    $('#sendtxt').addEventListener('click',send);
    $('#ta').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
  }
}

function updateControls(){
  var s=SL[state.idx];
  $('#ctl').hidden=!isHost();
  $('#prev').disabled=state.idx===0;$('#next').disabled=state.idx===N-1;
  var scored=s&&(s.t==='quiz'||s.t==='order');
  $('#qctl').hidden=!scored;
  if(scored){$('#reveal').textContent=state.revealed[s.id]?'Hide answer':'Reveal answer';$('#live').checked=!!state.live;$('#live').parentNode.hidden=(s.t!=='quiz');}
  $('#reset').hidden=role!=='teacher';$('#copylink').hidden=role!=='teacher';
}

function updateDynamic(){
  var s=SL[state.idx];if(!s)return;
  var me=answers[myUid]||mine;var xp=xpOf(me);
  $('#stat').textContent=role==='teacher'?('Class code '+hostCode+' · '+connectedCount()+' connected'):(canAnswer()&&mine.name?(mine.name+' · '+xp+' XP · '+rankOf(xp)):(role==='solo'?'Solo mode':''));
  var q=function(n){return document.querySelector('[data-dyn="'+n+'"]');};
  if(s.t==='title'){
    var w=q('welcome');if(w){
      w.textContent='';
      if(role==='teacher'){
        w.appendChild(el('div','lbl','JOIN THE CLASS'));
        var p1=el('div','big');p1.appendChild(document.createTextNode('Students go to '));p1.appendChild(el('b',null,location.origin+location.pathname));p1.appendChild(document.createTextNode(' and enter code '));var cb=el('b','mono',hostCode);cb.style.color='var(--brass)';cb.style.fontSize='1.8rem';cb.style.letterSpacing='.2em';p1.appendChild(cb);w.appendChild(p1);
        w.appendChild(el('div','small muted','Or press “Copy student link” below. Keep this tab open during class.'));
        var rs=el('div','small',relayOn?'Relay: ON. Students on other networks can connect.':'Relay: OFF. Students on a different network than you (for example Wi-Fi vs. wired) may not connect. See the setup note to turn it on.');
        rs.style.color=relayOn?'var(--green)':'var(--red)';rs.style.marginTop='.4rem';w.appendChild(rs);
      } else if(role==='student'){w.textContent=state.idx===0?'You’re in! Waiting for your teacher to start…':'';}
      else if(role==='solo'){w.textContent='Solo mode: use Next to move through the deck.';}
    }
  }
  if(s.t==='quiz'){
    var rev=!!state.revealed[s.id];var cs=counts(s);var showBars=rev||(state.live&&isHost());
    var mypick=mine.picks[s.id];
    document.querySelectorAll('#opts .opt').forEach(function(b,i){
      b.classList.toggle('sel',!rev&&mypick===i&&canAnswer());
      b.classList.toggle('ok',rev&&i===s.ans);b.classList.toggle('no',rev&&i!==s.ans);
      b.disabled=rev||!canAnswer();
      var bar=b.querySelector('.bar'),n=b.querySelector('.n');
      if(showBars&&cs.tot>0){bar.style.width=Math.round(cs.c[i]/cs.tot*100)+'%';n.textContent=cs.c[i];}else{bar.style.width='0';n.textContent='';}
    });
    var st=q('status');
    if(role==='teacher'){st.textContent=cs.tot+' of '+joined()+' answered';st.className='status muted';}
    else if(rev){
      if(typeof mypick!=='number'){st.textContent='No answer this time.';st.className='status muted';}
      else if(mypick===s.ans){st.textContent='Correct! +'+s.pts+' XP';st.className='status good';}
      else{st.textContent='Not quite. The right answer is highlighted.';st.className='status bad';}
    } else {st.textContent=typeof mypick==='number'?'Locked in. You can change it until the teacher reveals.':'Make your choice.';st.className='status muted';}
    var why=q('why');why.hidden=!rev;why.textContent=rev?s.why:'';
    if(s.kind==='vote'){
      var sb=q('stamp');sb.textContent='';
      if(rev){var st2=el('span','stamp '+(s.ans===0?'green':''),s.stamp[s.ans]);sb.appendChild(st2);}
      var ty=q('tally');
      if(ty){
        if(rev&&cs.tot>0){var g=Math.round(cs.c[0]/cs.tot*100);var wouldGrant=cs.c[0]/cs.tot>=4/9;ty.textContent='Class vote: '+g+'% grant. Rule of Four equivalent (4 of 9 is about 44%): the class would have '+(wouldGrant?'GRANTED':'DENIED')+' this petition.';}
        else ty.textContent='';
      }
    }
  }
  if(s.t==='order'){
    var rev2=!!state.revealed[s.id];var arr=Array.isArray(mine.picks[s.id])?mine.picks[s.id]:[];
    document.querySelectorAll('#pool .ochip').forEach(function(b){var i=Number(b.getAttribute('data-i'));b.disabled=rev2||!canAnswer()||arr.indexOf(i)>=0;});
    var seq=$('#seq');seq.textContent='';
    for(var k=0;k<s.items.length;k++){
      var li=el('li');var nn=el('span','nn',String(k+1));li.appendChild(nn);
      if(rev2){
        li.appendChild(el('span',null,s.items[k]));
        if(canAnswer()&&arr.length===s.items.length){li.className=arr[k]===k?'right':'wrong';}else li.className='filled';
      } else if(k<arr.length){li.appendChild(el('span',null,s.items[arr[k]]));li.className='filled';}
      seq.appendChild(li);
    }
    var cs2=0;Object.keys(answers).forEach(function(kk){var p=answers[kk]&&answers[kk].picks?answers[kk].picks[s.id]:null;if(Array.isArray(p)&&p.length===s.items.length)cs2++;});
    var st3=q('status');
    q('seqlbl').textContent=rev2?'CORRECT ORDER':'YOUR ORDER';
    if(role==='teacher'){st3.textContent=cs2+' of '+joined()+' submitted';st3.className='status muted';}
    else if(rev2){
      if(arr.length!==s.items.length){st3.textContent='You didn’t finish the order this time.';st3.className='status muted';}
      else{var c=0;arr.forEach(function(v,i){if(v===i)c++;});st3.textContent=c+' of '+s.items.length+' in the right spot: +'+scoreSlide(s,me)+' XP';st3.className='status '+(c===s.items.length?'good':'muted');}
    } else {st3.textContent=arr.length===s.items.length?'Order locked in. Tap Clear to start over until the teacher reveals.':(arr.length+' of '+s.items.length+' placed');st3.className='status muted';}
    var why2=q('why');why2.hidden=!rev2;why2.textContent=rev2?s.why:'';
  }
  if(s.t==='open'){
    var form=q('openform'),on=q('opennote');var c3=(mine.texts[s.id]||[]).length;
    if(form){form.hidden=!canAnswer();var tc=$('#txtcount');if(tc)tc.textContent=c3+' of 3 filed';var sb2=$('#sendtxt');if(sb2)sb2.disabled=c3>=3;}
    if(on)on.textContent=canAnswer()?'Dissents appear on the wall for the whole class to read.':'Dissents appear below as students file them.';
    var wall=q('wall');if(wall){
      wall.textContent='';var all=[];
      Object.keys(answers).forEach(function(k){var t=answers[k]&&answers[k].texts&&answers[k].texts[s.id];if(Array.isArray(t))t.forEach(function(x){if(typeof x==='string')all.push(x);});});
      all.slice(0,80).forEach(function(x,i){var d=el('div','note2',x);d.style.setProperty('--r',((i%5)-2)*0.6+'deg');wall.appendChild(d);});
    }
  }
  if(s.t==='final'){fillBoard(q('board'),10);}
  if(!$('#boardov').hidden)fillBoard($('#boardlist'),10);
}

function fillBoard(host,max){
  if(!host)return;host.textContent='';
  var rows=Object.keys(answers).map(function(k){var d=answers[k];return {name:(d&&d.name)||'',xp:xpOf(d),doc:d};}).filter(function(r){return r.name;});
  rows.sort(function(a,b){return b.xp-a.xp||a.name.localeCompare(b.name);});
  var wrap=el('div');wrap.innerHTML=svgStairs(rows.map(function(r){return {step:stairsToken(r.doc)};}),true);host.appendChild(wrap);
  var list=el('div','board');
  if(!rows.length){list.appendChild(el('div','muted','No cases filed yet.'));}
  rows.slice(0,max).forEach(function(r,i){
    var d=el('div');d.appendChild(el('span','pos',String(i+1)));d.appendChild(el('span','nm',r.name));d.appendChild(el('span','rk',rankOf(r.xp)));d.appendChild(el('b',null,r.xp+' XP'));list.appendChild(d);
  });
  host.appendChild(list);
}

/* ---------- host controls ---------- */
function go(i){
  if(!isHost())return;
  i=Math.max(0,Math.min(N-1,i));if(i===state.idx)return;
  state.idx=i;pushState();renderSlide();
}
$('#prev').addEventListener('click',function(){go(state.idx-1);});
$('#next').addEventListener('click',function(){go(state.idx+1);});
$('#reveal').addEventListener('click',function(){var s=SL[state.idx];if(s.t!=='quiz'&&s.t!=='order')return;if(state.revealed[s.id])delete state.revealed[s.id];else state.revealed[s.id]=true;pushState();updateControls();updateDynamic();});
$('#live').addEventListener('change',function(e){state.live=e.target.checked;pushState();updateDynamic();});
$('#boardbtn').addEventListener('click',function(){$('#boardov').hidden=false;fillBoard($('#boardlist'),10);});
$('#boardclose').addEventListener('click',function(){$('#boardov').hidden=true;});
function studentLink(){return location.origin+location.pathname+'?c='+hostCode;}
$('#copylink').addEventListener('click',function(){
  var l=studentLink();
  try{navigator.clipboard.writeText(l).then(function(){note('Student link copied: '+l);},function(){note('Student link: '+l);});}catch(e){note('Student link: '+l);}
});
document.addEventListener('keydown',function(e){
  if(!isHost()||e.target.matches('input,textarea'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown')go(state.idx+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp')go(state.idx-1);
});
var resetArmed=false;
$('#reset').addEventListener('click',function(){
  var b=$('#reset');
  if(!resetArmed){resetArmed=true;b.textContent='Click again to clear all answers';setTimeout(function(){resetArmed=false;b.textContent='Reset class';},4000);return;}
  resetArmed=false;b.textContent='Reset class';
  state={idx:0,revealed:{},live:false};answers={};persistHost();
  broadcast({t:'reset'});renderSlide();
});

/* ---------- join & landing ---------- */
function needJoin(){return canAnswer()&&!mine.name;}
function showJoin(){
  if(!needJoin()){$('#join').hidden=true;return;}
  var saved=lsGet('courtclimb-nick')||'';
  if(!$('#nick').value)$('#nick').value=saved;
  $('#join').hidden=false;
}
function doJoin(){
  var v=$('#nick').value.trim().slice(0,18);if(!v)return;
  mine.name=v;lsSet('courtclimb-nick',v);
  $('#join').hidden=true;saveMine();
}
$('#joinbtn').addEventListener('click',doJoin);
$('#nick').addEventListener('keydown',function(e){if(e.key==='Enter')doJoin();});

var qc=new URLSearchParams(location.search).get('c');
var saved=lsGet('courtclimb-host');
if(saved&&saved.code){$('#resumebtn').hidden=false;$('#resumebtn').textContent='Resume my class ('+saved.code+')';}
$('#bTeacher').addEventListener('click',function(){state={idx:0,revealed:{},live:false};answers={};startHost(null,false);});
$('#resumebtn').addEventListener('click',function(){
  state=saved.state||state;state.revealed=state.revealed||{};answers=saved.answers||{};startHost(saved.code,true);
});
$('#bStudent').addEventListener('click',function(){$('#stuform').hidden=false;$('#codein').focus();});
function goStudent(){var c=$('#codein').value;if(c.trim())startStudent(c);}
$('#codego').addEventListener('click',goStudent);
$('#codein').addEventListener('keydown',function(e){if(e.key==='Enter')goStudent();});
$('#bSolo').addEventListener('click',function(){role='solo';myUid='local';$('#land').hidden=true;note('Solo mode: answers stay on this device.');renderSlide();showJoin();});
if(qc){$('#stuform').hidden=false;$('#codein').value=qc.toUpperCase();}

role='lobby';
renderSlide();
})();
</script>
</body>
